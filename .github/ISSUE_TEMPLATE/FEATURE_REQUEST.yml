name: 💡 Идея для BudanovGram
description: Предложить функцию клиента, улучшение интерфейса или расширение API плагинов.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу нужно решить?
      placeholder: Опиши конкретный сценарий использования.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Как это должно работать?
      placeholder: Желаемое поведение, интерфейс или пример API.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Примеры и альтернативы
      description: Можно приложить скриншот или описать решение через плагин.
