name: 🐞 Ошибка BudanovGram
description: Проблема клиента, обновления или системы плагинов.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Версия BudanovGram
      description: Номер внизу бокового меню или в окне «О программе».
      placeholder: Укажи точный номер версии
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Версия Windows
      placeholder: Windows 11, 64 бит
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как повторить ошибку
      placeholder: Опиши действия по порядку.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Ожидаемый и фактический результат
      placeholder: Что должно было произойти и что произошло?
    validations:
      required: true
  - type: textarea
    id: plugins
    attributes:
      label: Плагины
      description: Если ошибка связана с плагином, укажи название, версию и возникает ли она при запуске с -no-plugins.
  - type: textarea
    id: context
    attributes:
      label: Скриншоты и журнал
      description: Удали токены, API-ключи и личные данные. Не прикладывай TelegramForcePortable или build-secrets.json.
